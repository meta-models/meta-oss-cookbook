# Model and QLoRA: NF4 language model, BF16 vision modules, LoRA on the
# language model's attention and MLP projections only.
model_name_or_path: meta-models/Muse-Glimmer-30B
model_init_kwargs:
  dtype: bfloat16
lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'

# Data: the first 2,048 training questions and 256 validation questions, as in
# the Axolotl recipe. All 821 validation questions are the held-out test.
train_size: 2048
validation_size: 256
test_size: null
assistant_only_loss: true      # loss on the assistant answer and its <|eot|> only
max_length: null               # sequences are 446-527 tokens; never truncate image tokens
packing: false

# Optimization: global batch 32 = 8 GPUs x 1 example x 4 accumulation steps.
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_steps: 0.1              # a value below 1 is a fraction of training steps
optim: adamw_bnb_8bit
weight_decay: 0.0
bf16: true                     # TRL also enables activation checkpointing by default

# Validation loss every 16 optimizer steps, starting before the first update.
eval_strategy: steps
eval_steps: 16
eval_on_start: true
per_device_eval_batch_size: 4

# Held-out generation: greedy, scored before and after training. The base
# model reasons privately before answering, so it gets room to finish.
max_new_tokens: 1024
generation_batch_size: 16

# Logging and output.
output_dir: outputs/muse-glimmer-cosyn-qlora
run_name: muse-glimmer-cosyn-qlora
report_to: wandb
logging_steps: 1
save_strategy: "no"            # the final adapter is saved to output_dir
seed: 42
